name: Sync forks

on:
  schedule:
    # 08:00 CET (UTC+1). During CEST (UTC+2, late Mar-late Oct) this
    # effectively runs at 09:00 local time since GitHub Actions cron
    # is always UTC and does not observe daylight saving.
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
    steps:
      - name: Sync allowlisted forks
        run: |
          repos=(
            spark
            llm4s
            kyo
            typesafe4s
            datafusion
            spec
            cask
            rockthejvm-site
            toon
            scalasql
            spark-xml
            zio-spark
            datafusion-comet
          )

          declare -A reason_fix=(
            ["Resource not accessible by personal access token"]="SYNC_PAT lacks repo write access | Use a classic PAT with 'repo' scope (fine-grained tokens need per-repo Contents:write)."
            ["forbids access via a fine-grained personal access tokens"]="Org blocks long-lived fine-grained tokens | Use a classic PAT instead, or a fine-grained token with lifetime <=366 days."
            ["diverging changes"]="Default branch has commits not in upstream | Already using --force; if this still fails, the branch may be protected -- remove branch protection on the default branch or allow force pushes for SYNC_PAT's identity."
            ["Not Found"]="Repo or upstream relationship missing | Confirm vim89/<repo> still exists and is a registered GitHub fork (not detached)."
          )

          {
            echo "## Fork sync report"
            echo ""
            echo "| Repo | Status | Reason | Suggested fix |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          status=0
          for repo in "${repos[@]}"; do
            echo "::group::Syncing vim89/$repo"
            output=$(gh repo sync "vim89/$repo" --force 2>&1) && rc=0 || rc=$?
            echo "$output"

            if [ "$rc" -eq 0 ]; then
              echo "| vim89/$repo | ✅ synced | - | - |" >> "$GITHUB_STEP_SUMMARY"
            else
              status=1
              reason="Unknown failure"
              fix="See raw log for vim89/$repo in this run."
              for pattern in "${!reason_fix[@]}"; do
                if [[ "$output" == *"$pattern"* ]]; then
                  reason="${reason_fix[$pattern]%% | *}"
                  fix="${reason_fix[$pattern]#* | }"
                  break
                fi
              done
              echo "::warning::sync failed for vim89/$repo: $reason"
              echo "| vim89/$repo | ❌ failed | $reason | $fix |" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          exit "$status"
